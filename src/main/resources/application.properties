spring.application.name=contocorrente
server.port=8080
#Connessione ad DB MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/conto_corrente
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect
#Creazione delle tabelle mancanti e aggiornamento dell schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Rifiuta proprietà JSON non previste dai DTO
spring.jackson.deserialization.fail-on-unknown-properties=true